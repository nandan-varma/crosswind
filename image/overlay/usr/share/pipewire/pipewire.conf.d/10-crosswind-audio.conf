# The guest's one sound card is the virtio-snd device the Mac exports (/dev/snd, ALSA card 0). WirePlumber finds
# sound cards through udev, which the guest does not run, so declare its output here. Without it PipeWire only has a
# dummy output and Linux apps are silent. Keep every object here creatable: one that fails stops PipeWire from
# starting at all (and `nofail` is not honored), so a microphone source needs a way to be added only when it works.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "crosswind.output"
            node.description = "Mac Audio Output"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:0,0"
            audio.position   = [ FL FR ]
        }
    }
]
