# The guest's one sound card is the virtio-snd device the Mac exports (/dev/snd, ALSA card 0). WirePlumber finds
# sound cards through udev, which the guest does not run, so declare its output (and, when allowed, input) here.
# Without it PipeWire only has a dummy output and Linux apps are silent.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "crosswind.output"
            node.description = "Mac Audio Output"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:0,0"
            audio.position   = [ FL FR ]
        }
    }
    # The microphone, present only while the Mac's microphone is allowed (Settings). Without a capture device this
    # node is simply not created; it comes after the sink so it can never affect playback.
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.source
            node.name        = "crosswind.input"
            node.description = "Mac Microphone"
            media.class      = "Audio/Source"
            api.alsa.path    = "hw:0,0"
            audio.position   = [ FL FR ]
        }
    }
]
