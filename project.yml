# XcodeGen spec. Generate the project with `make project`; Crosswind.xcodeproj is not committed.
name: Crosswind
options:
  bundleIdPrefix: dev.crosswind
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 72CW7UW6RB
    CODE_SIGN_STYLE: Manual
    # Ad-hoc signing by default (CI, local builds); release builds set RELEASE_SIGN to a Developer ID identity.
    CODE_SIGN_IDENTITY: "$(RELEASE_SIGN:default=-)"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  CrosswindKit:
    path: Packages/CrosswindKit
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
targets:
  # Store app: UI only. Embeds the host agent (launchd helper) and the per-app stub template.
  Crosswind:
    type: application
    platform: macOS
    sources:
      - path: App/Store
        excludes:
          - Resources
      - path: App/Store/Resources/dev.crosswind.host.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: CrosswindKit
      - target: CrosswindHost
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: CrosswindAppStub
        embed: true
        copy:
          destination: resources
      - target: crosswindctl
        copy:
          destination: executables
    info:
      path: build/Info.plist
      properties:
        CFBundleName: Crosswind
        CFBundleDisplayName: Crosswind
        CFBundleIdentifier: dev.crosswind.app
        CFBundleExecutable: Crosswind
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "AGPL-3.0-or-later"
        NSPrincipalClass: NSApplication
  # Background agent: owns the VM. Started on demand by launchd through the Mach service dev.crosswind.host.
  CrosswindHost:
    type: application
    platform: macOS
    sources:
      - path: App/Host
    dependencies:
      - package: CrosswindKit
    settings:
      base:
        SKIP_INSTALL: YES
    info:
      path: build/CrosswindHost-Info.plist
      properties:
        CFBundleName: CrosswindHost
        CFBundleDisplayName: CrosswindHost
        CFBundleIdentifier: dev.crosswind.host
        CFBundleExecutable: CrosswindHost
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: App/Host/CrosswindHost.entitlements
      properties:
        com.apple.security.virtualization: true
  # Template for the per-app stub bundles. Generated copies set CrosswindAppID later.
  CrosswindAppStub:
    type: application
    platform: macOS
    sources:
      - path: App/Stub
    dependencies:
      - package: CrosswindKit
    settings:
      base:
        SKIP_INSTALL: YES
    info:
      path: build/CrosswindAppStub-Info.plist
      properties:
        CFBundleName: CrosswindAppStub
        CFBundleDisplayName: CrosswindAppStub
        CFBundleIdentifier: dev.crosswind.appstub
        CFBundleExecutable: CrosswindAppStub
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CrosswindAppID: ""
        LSMinimumSystemVersion: "27.0"
        NSPrincipalClass: NSApplication
  crosswindctl:
    type: tool
    platform: macOS
    settings:
      base:
        SKIP_INSTALL: YES
    sources:
      - path: tools/crosswindctl
    dependencies:
      - package: CrosswindKit
      - package: ArgumentParser
        product: ArgumentParser
  CrosswindTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CrosswindTests
    dependencies:
      - target: Crosswind
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crosswind.app/Contents/MacOS/Crosswind"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Crosswind:
    build:
      targets:
        Crosswind: all
        CrosswindHost: all
        CrosswindAppStub: all
        crosswindctl: all
        CrosswindTests: [test]
    test:
      targets:
        - CrosswindTests
