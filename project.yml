# XcodeGen spec. Generate the project with `make project`; Crosswind.xcodeproj is not committed.
name: Crosswind
options:
  bundleIdPrefix: dev.crosswind
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 72CW7UW6RB
    CODE_SIGN_STYLE: Manual
    # Ad-hoc signing by default (CI, local builds); release builds set RELEASE_SIGN to a Developer ID identity.
    CODE_SIGN_IDENTITY: "$(RELEASE_SIGN:default=-)"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode extracts UI strings into the String Catalogs (App/*/Localizable.xcstrings) at build time.
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  CrosswindKit:
    path: Packages/CrosswindKit
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  # Store app: UI only. Embeds the host agent (launchd helper) and the per-app stub template.
  Crosswind:
    type: application
    platform: macOS
    settings:
      base:
        SKIP_INSTALL: NO
        INSTALL_PATH: /Applications
    sources:
      - path: App/Store
        excludes:
          - Resources
      - path: App/Store/Resources/CompatRatings.json
        buildPhase: resources
      - path: App/Store/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: App/Store/Resources/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: App/Store/Resources/dev.crosswind.host.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: CrosswindKit
      - package: Sparkle
        product: Sparkle
      - target: CrosswindHost
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Helpers
      - target: CrosswindAppStub
        embed: true
        copy:
          destination: resources
      - target: crosswindctl
        copy:
          destination: executables
    # The guest image manifest is written by scripts/release.sh (IMAGE_DIR and IMAGE_BASE_URL). Dev builds have none.
    postBuildScripts:
      - name: Embed guest image manifest
        script: |
          if [ -f "$SRCROOT/build/GuestImage.json" ]; then
              cp "$SRCROOT/build/GuestImage.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GuestImage.json"
          fi
    info:
      path: build/Info.plist
      properties:
        CFBundleName: Crosswind
        CFBundleDisplayName: Crosswind
        CFBundleIdentifier: dev.crosswind.app
        CFBundleExecutable: Crosswind
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "AGPL-3.0-or-later"
        NSPrincipalClass: NSApplication
        # Sparkle 2 app updates. The appcast is published by scripts/appcast.sh; the EdDSA private key lives in the
        # login keychain (Sparkle's generate_keys), never in the repo.
        SUFeedURL: https://github.com/nandan-varma/crosswind/releases/latest/download/appcast.xml
        SUPublicEDKey: b7fNjRO+y81OOiZ2UgNHVOTYDwAWmcJWUxkgUjDcoFA=
        SUEnableAutomaticChecks: YES
        SUEnableSystemProfiling: NO
  # Background agent: owns the VM. Started on demand by launchd through the Mach service dev.crosswind.host.
  CrosswindHost:
    type: application
    platform: macOS
    sources:
      - path: App/Host
    dependencies:
      - package: CrosswindKit
    settings:
      base:
        SKIP_INSTALL: YES
    info:
      path: build/CrosswindHost-Info.plist
      properties:
        CFBundleName: CrosswindHost
        CFBundleDisplayName: CrosswindHost
        CFBundleIdentifier: dev.crosswind.host
        CFBundleExecutable: CrosswindHost
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Linux apps can record from your microphone when you allow it in Crosswind settings."
        NSPrincipalClass: NSApplication
    entitlements:
      path: App/Host/CrosswindHost.entitlements
      properties:
        com.apple.security.virtualization: true
        com.apple.security.device.audio-input: true
  # Template for the per-app stub bundles. Generated copies set CrosswindAppID later.
  CrosswindAppStub:
    type: application
    platform: macOS
    sources:
      - path: App/Stub
    dependencies:
      - package: CrosswindKit
    settings:
      base:
        SKIP_INSTALL: YES
    info:
      path: build/CrosswindAppStub-Info.plist
      properties:
        CFBundleName: CrosswindAppStub
        CFBundleDisplayName: CrosswindAppStub
        CFBundleIdentifier: dev.crosswind.appstub
        CFBundleExecutable: CrosswindAppStub
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CrosswindAppID: ""
        LSMinimumSystemVersion: "27.0"
        NSPrincipalClass: NSApplication
  crosswindctl:
    type: tool
    platform: macOS
    settings:
      base:
        SKIP_INSTALL: YES
    sources:
      - path: tools/crosswindctl
    dependencies:
      - package: CrosswindKit
      - package: ArgumentParser
        product: ArgumentParser
  CrosswindTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CrosswindTests
    dependencies:
      - target: Crosswind
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crosswind.app/Contents/MacOS/Crosswind"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Crosswind:
    build:
      targets:
        Crosswind: all
        CrosswindHost: all
        CrosswindAppStub: all
        crosswindctl: all
        CrosswindTests: [test]
    test:
      targets:
        - CrosswindTests
